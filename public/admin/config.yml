# Sveltia CMS の設定。フィールドは src/content.config.ts のスキーマと揃える
backend:
  name: github
  repo: tadokorokantoku/blog
  branch: main

# slug の {{year}} などは date フィールドの値から作られるが、既定だと UTC で読まれる。
# 日本時間の朝に書いたひとことの slug が前日になってしまうので local にする
slug:
  timezone: local

# 全体共通の画像置き場（必須）。記事の画像は collection 側の設定で記事フォルダに置く
media_folder: public/images
public_folder: /images

site_url: https://inok.dev
locale: ja

collections:
  # 長文。タイトルと説明文が必須で、slug は自分で決める
  - name: posts
    label: 記事
    label_singular: 記事
    icon: article
    folder: src/content/posts
    path: '{{slug}}/index'
    slug: '{{fields._slug}}'
    media_folder: ''
    public_folder: ''
    create: true
    extension: md
    format: frontmatter
    sortable_fields: [date, title]
    summary: '{{title}}{{draft | ternary(" (draft)", "")}}'
    preview_path: posts/{{slug}}/
    fields:
      - { name: title, label: タイトル, widget: string }
      - {
          name: date,
          label: 公開日,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
          format: YYYY-MM-DD,
          default: '{{now}}',
        }
      - { name: description, label: 説明文, widget: text, hint: 一覧と RSS に出る抜粋 }
      - { name: tags, label: タグ, widget: list, required: false, default: [] }
      - {
          name: updated,
          label: 更新日,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
          format: YYYY-MM-DD,
          required: false,
        }
      - { name: draft, label: 下書き, widget: boolean, default: true }
      - { name: cover, label: カバー画像, widget: image, required: false }
      - { name: body, label: 本文, widget: markdown, modes: [raw, rich_text] }

  # 短文。タイトルは任意で、slug は日時から自動で決まる
  # （同じ分に2本書いても Sveltia が末尾に連番を付けるので衝突しない）
  - name: notes
    label: ひとこと
    label_singular: ひとこと
    icon: chat
    folder: src/content/notes
    path: '{{slug}}/index'
    slug: '{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}'
    media_folder: ''
    public_folder: ''
    create: true
    extension: md
    format: frontmatter
    sortable_fields: [date]
    summary: "{{date | date('MM/DD HH:mm')}} {{title | default('(タイトルなし)')}}"
    preview_path: notes/{{slug}}/
    fields:
      - {
          name: date,
          label: 日時,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: HH:mm,
          format: YYYY-MM-DDTHH:mm,
          default: '{{now}}',
        }
      - { name: title, label: タイトル, widget: string, required: false, hint: 無くてもいい }
      - { name: tags, label: タグ, widget: list, required: false, default: [] }
      - { name: draft, label: 下書き, widget: boolean, default: false }
      - { name: body, label: 本文, widget: markdown, modes: [raw, rich_text] }

  # ニュース。1エントリが1カテゴリの1日分で、記事は items に並べる
  # Xtrend は Grokbot の出力をここに手で貼る想定
  # カテゴリの選択肢は src/consts.ts の NEWS_CATEGORIES と同じものを並べる
  - name: news
    label: ニュース
    label_singular: ニュース
    icon: newspaper
    folder: src/content/news
    path: '{{category}}/{{slug}}'
    slug: '{{year}}-{{month}}-{{day}}'
    media_folder: ''
    public_folder: ''
    create: true
    extension: json
    format: json
    sortable_fields: [collectedAt, category]
    summary: "{{collectedAt | date('YYYY-MM-DD')}} {{category}}"
    preview_path: news/{{category}}/
    fields:
      - {
          name: category,
          label: カテゴリ,
          widget: select,
          options:
            [
              { label: X トレンド, value: xtrend },
              { label: GitHub トレンド, value: githubtrend },
              { label: Claude Code, value: claude-code },
              { label: Orca, value: orca },
            ],
        }
      - {
          name: collectedAt,
          label: 収集日時,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: HH:mm,
          format: YYYY-MM-DDTHH:mm,
          default: '{{now}}',
        }
      - name: items
        label: 記事
        widget: list
        default: []
        summary: '{{fields.title}}'
        fields:
          - { name: title, label: タイトル, widget: string }
          - { name: url, label: URL, widget: string }
          - { name: source, label: 出典, widget: string, hint: 'from: のあとに出る名前' }
          - { name: summary, label: 要約, widget: text, required: false }
          - { name: image, label: サムネ画像 URL, widget: string, required: false }
          - {
              name: publishedAt,
              label: 公開日,
              widget: datetime,
              date_format: YYYY-MM-DD,
              time_format: false,
              format: YYYY-MM-DD,
              required: false,
              hint: 空なら収集日時で並ぶ,
            }
